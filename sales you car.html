
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Car Gallery</h1>
    <div class="gallery">
        <img src="chui.jpeg" alt="Car 1">
        <img src="simba.jpeg" alt="Car 2">
        <img src="laizer.jpeg" alt="Car 3">
        <!-- Add more images as needed -->
        <img src="the only.jpeg" alt="Car 4">
        <img src="toyota.jpeg" alt="Car 5">
    </div>
</body>
</html>
