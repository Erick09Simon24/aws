
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Gallery with Prices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .gallery-item {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
        }
        .caption {
            padding: 15px;
            text-align: center;
        }
        .caption h3 {
            margin: 0;
            font-size: 1.2em;
        }
        .caption p {
            margin: 5px 0 0;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Car Gallery with Prices</h1>
    <div class="gallery" id="car-gallery"></div>

    <script>
        const cars = [
            {
                model: 'Car Model 1',
                price: 25000,
                image: 'new one.jpeg'
            },
            {
                model: 'Car Model 2',
                price: 30000,
                image: 'laizer.jpeg'
            },
            {
                model: 'Car Model 3',
                price: 28000,
                image: 'chui.jpeg'
            }
            // Add more car objects as needed
        ];

        function createGalleryItem(car) {
            return `
                <div class="gallery-item">
                    <img src="${car.image}" alt="${car.model}">
                    <div class="caption">
                        <h3>${car.model}</h3>
                        <p>$${car.price.toLocaleString()}</p>
                    </div>
                </div>
            `;
        }

        function displayGallery() {
            const galleryContainer = document.getElementById('car-gallery');
            cars.forEach(car => {
                galleryContainer.innerHTML += createGalleryItem(car);
            });
        }

        // Initialize the gallery
        displayGallery();
    </script>
</body>
</html>
